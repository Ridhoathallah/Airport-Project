# Airport X-Ray Screening Queue Monitoring — operational configuration.
#
# Thresholds here are EXAMPLE values only. For a real airport deployment
# they must be calibrated from safety requirements, the physical layout,
# local regulations, human-factors studies, historical flow data, and
# operational needs. Do not treat them as certified safety limits.

airport_id: A01
terminal_id: T1
zone_id: XRAY01

zone:
  name: "X-Ray Screening Queue"
  area_m2: 50.0            # monitored floor area (must be calibrated)
  max_capacity: 50         # expected safe queue capacity
  warning_percentage: 70   # occupancy -> WARNING
  crowded_percentage: 85   # occupancy -> CROWDED
  critical_percentage: 100 # occupancy -> CRITICAL

density_thresholds:        # people per m²
  empty: 0.00
  sparse: 0.10
  normal: 0.40
  crowded: 0.60
  congested: 0.80

flow:
  baseline_per_minute: 12.0   # expected normal throughput (people/min)
  backlog_ratio: 0.5          # flow < baseline*ratio counts as "low flow"
  windows_minutes: [1, 5, 15, 30, 60]

distance:
  safe_spacing_m: 1.0
  # Camera fallback when no depth sensor is present: how many pixels map to
  # one metre at the monitored distance. Must be calibrated per install.
  calibration_px_per_m: 100.0

sensors:
  s1:
    id: SENSOR_01
    type: vision
    role: queue_entry_flow
    enabled: true
  s2:
    id: SENSOR_02
    type: vision_secondary
    role: validation
    enabled: true
  s3:
    id: SENSOR_03
    type: vision_downstream
    role: downstream_xray_validation
    enabled: true
  # Relative tolerance when comparing two sensors on the same metric.
  # agreement_tolerance: 0.15 means |a-b|/max(a,b) <= 0.15 counts as agreement.
  agreement_tolerance:
    people_count: 0.15
    density: 0.20
    flow_rate: 0.25
  staleness_seconds: 5.0   # a sensor with no reading for this long is OFFLINE

state:
  debounce_frames: 5       # consecutive consistent evaluations to commit a state
  hysteresis: 0.05         # metric slack before a state downgrades

backlog:
  min_queue_people: 15        # queue size must be >= this to consider backlog
  min_density: 0.60           # people/m² minimum
  persistence_seconds: 10.0   # condition must hold this long

alerts:
  enabled: true
  min_confidence: 0.60
  debounce_seconds: 5.0    # avoid alert flapping

performance_targets:
  telemetry_latency_s: 1.0
  dashboard_latency_s: 2.0
  alert_latency_s: 3.0
